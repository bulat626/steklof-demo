name: Publish Steklof demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('_site').resolve()
          root.mkdir()
          manifest = json.loads(Path('archives.json').read_text())
          for name, info in sorted(manifest.items()):
              archive = Path(name)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == info['sha256'], name
              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      assert (root / member.filename).resolve().is_relative_to(root)
                  z.extractall(root)
          assert (root / 'index.html').is_file()
          print('Website ready:', len(list(root.rglob('*'))), 'entries')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
